name: Builder
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0/30 * * * *"
  # Lets a sheet-only change be published without waiting for the schedule.
  # Re-running a past run is not a substitute: it checks out that run's commit,
  # so its push is rejected once master has moved on.
  workflow_dispatch:

jobs:
  build:
    name: Build 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build the website with the latest contents
        uses: ./action-build
        with:
          API_KEY: ${{ secrets.API_KEY }}
          DATA_URL: ${{ secrets.DATA_URL }}

      - name: Commit changed files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs assets
          if git diff --cached --quiet
          then
              echo "No changes since last run"
          else
              git commit -m "build the website with the latest source data - $(date)"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}